name: Demo-2

on: 
  workflow_dispatch:

env:
  GREETING: "hello"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Create a text file
      run: echo "${{env.GREETING}}, ${{secrets.WORLD}}!" > hello.txt
    - uses: actions/upload-artifact@v7
      with:
        name: hello-file
        path: hello.txt
  test:
    env:
      GREETINGS2: "hello2"
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: hello-file
    - name: List all files
      run: ls
    - name: Test file
      run: cat hello.txt | grep -i "Hello, world!"
  
